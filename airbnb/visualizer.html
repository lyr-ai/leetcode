<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T = (x, y, s, cls = '', a = '') => `<text x="${x}" y="${y}" ${cls ? `class="${cls}"` : ''} ${a}>${esc(s)}</text>`;
const R = (x, y, w, h, cls, rx = 6) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${cls}"/>`;
const MID = 'text-anchor="middle"', END = 'text-anchor="end"';
const DEFS = `<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker>
 <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp2"/></marker></defs>`;

/* ---------- 751 IP to CIDR ---------- */
const ipInt = ip => ip.split('.').reduce((a, o) => a * 256 + Number(o), 0);
const intIp = x => [3, 2, 1, 0].map(k => Math.floor(x / 256 ** k) % 256).join('.');
const lowbit = x => { if (x === 0) return 2 ** 32; let s = 1; while (x % (s * 2) === 0) s *= 2; return s; };

/* ---------- 1257 tree layout ---------- */
function layoutTree(regions) {
  const kids = {}, par = {};
  regions.forEach(([b, ...s]) => { kids[b] = (kids[b] || []).concat(s); s.forEach(x => par[x] = b); });
  const root = regions.map(r => r[0]).find(n => !par[n]);
  const pos = {}; let leaf = 0, depth = 0;
  (function walk(n, d) {
    depth = Math.max(depth, d);
    const ch = kids[n] || [];
    if (!ch.length) pos[n] = { x: leaf++, d };
    else { ch.forEach(c => walk(c, d + 1)); pos[n] = { x: (pos[ch[0]].x + pos[ch[ch.length - 1]].x) / 2, d }; }
  })(root, 0);
  return { pos, par, leaves: leaf, depth };
}

/* ---------- 631 helpers ---------- */
function expand(ref) {
  const [a, b] = ref.split(':'), p = s => ({ c: s.charCodeAt(0), r: +s.slice(1) });
  const A = p(a), B = b ? p(b) : A, out = [];
  for (let r = A.r; r <= B.r; r++) for (let c = A.c; c <= B.c; c++) out.push(String.fromCharCode(c) + r);
  return out;
}
const fmtOp = op => `${op[0]}(${op.slice(1).map(x => JSON.stringify(x)).join(', ')})`;

const PROBLEMS = [
/* ======================================================================= */
{ id: '751', title: 'IP to CIDR', diff: 'M', freq: 71.3, both: true, slug: 'ip-to-cidr',
  idea: '<b>思路：</b>每次从当前地址 x 出发，取最大的“对齐”块。块大小是 x 的最低位 1（x &amp; −x），但不能超过剩余要覆盖的数量 n，超过就减半。一个大小为 2^k 的块就是前缀长度 32 − k 的 CIDR。',
  code: `def ipToCIDR(ip, n):
    x = ip_to_int(ip)
    res = []
    while n > 0:
        step = x & -x              # 最低位的 1：x 处最大的对齐块
        while step > n:
            step //= 2
        res.append(f"{int_to_ip(x)}/{33 - step.bit_length()}")
        x += step
        n -= step
    return res`,
  examples: [{ label: '255.0.0.7, n=10', args: { ip: '255.0.0.7', n: 10 } },
             { label: '117.145.102.62, n=8', args: { ip: '117.145.102.62', n: 8 } },
             { label: '192.168.1.5, n=9', args: { ip: '192.168.1.5', n: 9 } }],
  view: [760, 250],
  run({ ip, n }) {
    const F = [], start = ipInt(ip), total = n; let x = start; const res = [];
    const snap = (line, msg, ex = {}) => F.push({ line, msg, x, n, start, total, res: res.map(r => ({ ...r })), ...ex,
      vars: { x: `${x}  (${intIp(x)})`, n, step: ex.step ?? '—', res: res.map(r => r.cidr).join('  ') || '[]' } });
    snap(2, `把 ${ip} 转成 32 位整数 x = ${x}，要覆盖 n = ${n} 个地址。`);
    while (n > 0) {
      let step = lowbit(x);
      snap(5, `x 的最低位 1 是 2^${Math.log2(step)} = ${step}：从 x 开始，最大的对齐块有 ${step} 个地址。`, { step, cand: step, lb: true });
      while (step > n) { step /= 2; snap(7, `${step * 2} 超过剩余的 n = ${n}，减半为 ${step}。`, { step, cand: step }); }
      const len = 32 - Math.log2(step);
      res.push({ off: x - start, size: step, cidr: `${intIp(x)}/${len}` });
      snap(8, `输出 ${intIp(x)}/${len}：前 ${len} 位固定，后 ${32 - len} 位任意，正好 ${step} 个地址。`, { step });
      x += step; n -= step;
      snap(10, `x 前进到 ${intIp(x)}，还剩 n = ${n}。`);
    }
    snap(11, `完成：${res.length} 个 CIDR 块恰好覆盖这 ${total} 个地址。`, { done: true });
    return F;
  },
  render(f) {
    let s = T(20, 18, 'x 的 32 位（青色 = 当前块里可以任意取值的主机位，琥珀色框 = 最低位的 1）', 'tl');
    const k = f.step ? Math.log2(f.step) : -1, lb = Math.log2(lowbit(f.x));
    for (let i = 31; i >= 0; i--) {
      const col = 31 - i, X = 20 + col * 21 + Math.floor(col / 8) * 12, bit = Math.floor(f.x / 2 ** i) % 2;
      s += R(X, 40, 18, 26, i < k ? 'acc' : 'cell', 4) + T(X + 9, 58, bit, bit ? 'tb' : 'tm', MID);
      if (f.lb && i === lb) s += R(X - 2, 38, 22, 30, 'mark', 5);
    }
    for (let o = 0; o < 4; o++) s += T(20 + o * 180 + 84, 84, Math.floor(f.x / 256 ** (3 - o)) % 256, 'tm', MID);
    const X0 = 20, W = 708, sc = W / f.total, Y = 112;
    s += T(20, Y - 8, `要覆盖的 ${f.total} 个地址`, 'tl') + R(X0, Y, W, 34, 'cell', 4);
    f.res.forEach((r, i) => {
      s += R(X0 + r.off * sc, Y, r.size * sc, 34, 'ok', 3);
      if (r.size * sc > 70) s += T(X0 + (r.off + r.size / 2) * sc, Y + 21, r.cidr, '', MID);
    });
    if (f.cand) { const off = f.x - f.start, x = X0 + off * sc, w = Math.min(f.cand * sc, X0 + W + 24 - x);
      s += `<rect x="${x}" y="${Y - 4}" width="${w}" height="42" rx="4" class="cand"/>`;
      if (off + f.cand > f.total) s += T(X0 + W, Y + 56, `候选块 ${f.cand} > 剩余 ${f.n}`, 'tm', END); }
    s += T(X0, Y + 56, intIp(f.start), 'tm') ;
    s += T(20, 200, '输出', 'tl');
    let cx = 60; f.res.forEach(r => { const w = r.cidr.length * 7.4 + 16; if (cx + w > 740) return; s += R(cx, 186, w, 24, 'ok', 12) + T(cx + w / 2, 202, r.cidr, '', MID); cx += w + 8; });
    return s;
  } },

/* ======================================================================= */
{ id: '1058', title: 'Minimize Rounding Error to Meet Target', short: 'Minimize Rounding Error', diff: 'M', freq: 69.3, both: true, slug: 'minimize-rounding-error-to-meet-target',
  idea: '<b>思路：</b>先全部向下取整，差多少就必须有 k 个数向上取整。向上取整的误差是 1 − f，向下取整是 f，所以应该把小数部分 f 最大的 k 个数向上取整。k 不在 [0, 非整数个数] 内就无解。面经里叫 <b>Round Prices</b>。',
  code: `def minimizeError(prices, target):
    fl = [floor(float(p)) for p in prices]
    fr = [float(p) - f for p, f in zip(prices, fl)]
    k = target - sum(fl)                  # 需要向上取整的个数
    fracs = sorted((f for f in fr if f > 0), reverse=True)
    if k < 0 or k > len(fracs): return "-1"
    err = sum(1 - f for f in fracs[:k]) + sum(fracs[k:])
    return f"{err:.3f}"`,
  examples: [{ label: '[0.7, 2.8, 4.9] → 8', args: { prices: ['0.700', '2.800', '4.900'], target: 8 } },
             { label: '[2.3, 1.1, 4.7, 0.9] → 9', args: { prices: ['2.300', '1.100', '4.700', '0.900'], target: 9 } },
             { label: '[1.5, 2.5, 3.5] → 10', args: { prices: ['1.500', '2.500', '3.500'], target: 10 } }],
  view: [760, 300],
  run({ prices, target }) {
    const F = [], rows = prices.map(p => ({ p, fl: null, fr: null, d: null }));
    let k = null, err = null, order = rows.map((_, i) => i);
    const snap = (line, msg, ex = {}) => F.push({ line, msg, rows: rows.map(r => ({ ...r })), order: [...order], k, err, target, ...ex,
      vars: { target, 'sum(fl)': rows.every(r => r.fl !== null) ? rows.reduce((a, r) => a + r.fl, 0) : '…', k: k ?? '…', err: err === null ? '…' : err.toFixed(3) } });
    snap(1, `目标和是 ${target}。每个价格只能取 floor 或 ceil，要让总误差最小。`);
    rows.forEach((r, i) => { r.fl = Math.floor(+r.p); r.fr = +((+r.p) - r.fl).toFixed(3);
      snap(2, `${r.p} 向下是 ${r.fl}，小数部分 f = ${r.fr.toFixed(3)}。`, { cur: i }); });
    const F0 = rows.reduce((a, r) => a + r.fl, 0); k = target - F0;
    snap(4, `全部向下取整的和是 ${F0}，所以必须有 k = ${target} − ${F0} = ${k} 个数向上取整。`);
    const nonint = rows.map((_, i) => i).filter(i => rows[i].fr > 0);
    order = [...nonint].sort((a, b) => rows[b].fr - rows[a].fr).concat(rows.map((_, i) => i).filter(i => rows[i].fr === 0));
    snap(5, `按小数部分从大到小排序：f 越大，向上取整的误差 1 − f 越小。`);
    if (k < 0 || k > nonint.length) { snap(6, `k = ${k} 不在 [0, ${nonint.length}] 里，凑不出目标，返回 "-1"。`, { fail: true }); return F; }
    err = 0;
    order.forEach((i, j) => {
      const r = rows[i];

{ id: '756', title: 'Pyramid Transition Matrix', short: 'Pyramid Transition', diff: 'M', freq: 69.3, both: true, slug: 'pyramid-transition-matrix',
  idea: '<b>思路：</b>回溯。在当前这一行上面，从左到右一块一块地放：每个位置只能放 allowed 里“下面两块 → 上面一块”允许的字母。一行放满就递归往上；放不下就回溯。把已经证明搭不上去的行记进 bad，避免重复搜索。',
  code: `def pyramidTransition(bottom, allowed):
    up = defaultdict(list)
    for a, b, c in allowed:
        up[a + b].append(c)
    bad = set()                          # 已证明搭不上去的行

    def solve(row):
        if len(row) == 1:
            return True
        if row in bad:
            return False
        if fill(row, 0, ""):
            return True
        bad.add(row)
        return False

    def fill(row, i, cur):               # 一块一块地搭上一行
        if i == len(row) - 1:
            return solve(cur)
        for c in up[row[i:i + 2]]:
            if fill(row, i + 1, cur + c):
                return True
        return False

    return solve(bottom)`,
  examples: [{ label: 'BCD → True', args: { bottom: 'BCD', allowed: ['BCC', 'CDE', 'CEA', 'FFF'] } },
             { label: 'AAAA → False', args: { bottom: 'AAAA', allowed: ['AAB', 'AAC', 'BCD', 'BBE', 'DEF'] } },
             { label: 'ABC → True（要回溯）', args: { bottom: 'ABC', allowed: ['ABD', 'ABE', 'BCF', 'EFG'] } }],
  view: [760, 300],
  run({ bottom, allowed }) {
    const F = [], up = {}, levels = [bottom], bad = new Set(); let cap = false;
    allowed.forEach(s => (up[s[0] + s[1]] ||= []).push(s[2]));
    const table = Object.entries(up).map(([k, v]) => `${k}→${v.join('/')}`).join('  ');
    const snap = (line, msg, ex = {}, force) => { if (F.length >= 400 && !force) { cap = true; return; }
      F.push({ line, msg, levels: [...levels], n: bottom.length, ...ex, vars: { 查找表: table, 层: levels.length - 1, bad: [...bad].join(', ') || '∅' } }); };
    snap(4, `把 allowed 建成查找表：下面两块 → 上面可以放哪些字母。`);
    function solve(L) {
      const row = levels[L];
      if (row.length === 1) { snap(9, `搭到塔顶 "${row}"，成功。`, { win: true }); return true; }
      if (bad.has(row)) { snap(11, `"${row}" 之前已证明搭不上去，直接返回 False（记忆化剪枝）。`, { badRow: L }); return false; }
      levels[L + 1] = '';
      if (fill(L, 0)) return true;
      levels.length = L + 1; bad.add(row);
      snap(14, `"${row}" 上面怎么放都搭不出来，记入 bad。`, { badRow: L }); return false;
    }
    function fill(L, i) {
      const row = levels[L];
      if (i === row.length - 1) { snap(19, `第 ${L + 1} 层 "${levels[L + 1]}" 放满了，递归往上搭。`, { rowDone: L + 1 });
        const ok = solve(L + 1); if (!ok) levels.length = L + 2; return ok; }
      const pair = row.slice(i, i + 2), cands = up[pair] || [];
      if (!cands.length) snap(20, `"${pair}" 上面没有允许的块。`, { cell: [L + 1, i], pair: [L, i], st: 'bad' });
      for (const c of cands) {
        levels[L + 1] = levels[L + 1].slice(0, i) + c;
        snap(20, `在 "${pair}" 上面试放 ${c}。`, { cell: [L + 1, i], pair: [L, i], st: 'cur' });
        if (fill(L, i + 1)) return true;
        levels[L + 1] = levels[L + 1].slice(0, i);
        snap(21, `放 ${c} 走不通，回溯。`, { cell: [L + 1, i], pair: [L, i], st: 'bad' });
      }
      return false;
    }
    const ok = solve(0);
    snap(25, (ok ? '返回 True。' : '返回 False：无论怎么放都到不了塔顶。') + (cap ? '（搜索步数太多，动画只展示前 400 步）' : ''), { final: ok }, true);
    return F;
  },
  render(f) {
    let s = ''; const n = f.n, C = 52, cx = 380, base = 250;
    for (let L = 0; L < n; L++) {
      const cnt = n - L, row = f.levels[L] || '', y = base - L * (C + 4);
      for (let i = 0; i < cnt; i++) {
        const x = cx - (cnt * (C + 4)) / 2 + i * (C + 4), ch = row[i] || '';
        let cls = L === 0 ? 'cell' : ch ? 'acc' : 'ghost';
        if (f.badRow === L && ch) cls = 'bad';
        if (f.cell && f.cell[0] === L && f.cell[1] === i) cls = f.st;
        if ((f.win || f.final) && ch) cls = 'ok';
        if (f.final === false && L === 0) cls = 'bad';
        s += R(x, y, C, C, cls, 6) + (ch ? T(x + C / 2, y + C / 2 + 7, ch, 'big', MID) : '');
      }
    }
    if (f.pair) { const [L, i] = f.pair, cnt = n - L, y = base - L * (C + 4), x = cx - (cnt * (C + 4)) / 2 + i * (C + 4);
      s += `<rect x="${x - 3}" y="${y - 3}" width="${2 * C + 10}" height="${C + 6}" rx="8" class="mark"/>`; }
    s += T(20, 24, '底层固定；青色 = 已放的块，琥珀色 = 正在尝试，红色 = 回溯', 'tl');
    return s;
  } },

{ id: '1235', title: 'Maximum Profit in Job Scheduling', short: 'Max Profit Job Scheduling', diff: 'H', freq: 92.4, both: false, slug: 'maximum-profit-in-job-scheduling',
  idea: '<b>思路：</b>按结束时间排序，dp[i] = 只考虑前 i 个工作时的最大收益。对第 i 个工作：不做就是 dp[i−1]；做的话，用二分找出在它开始前就结束的工作有 j 个，收益是 dp[j] + profit。两者取大。O(n log n)。',
  code: `def jobScheduling(startTime, endTime, profit):
    jobs = sorted(zip(endTime, startTime, profit))
    ends = [e for e, _, _ in jobs]
    dp = [0] * (len(jobs) + 1)
    for i, (e, s, p) in enumerate(jobs, 1):
        j = bisect_right(ends, s, 0, i - 1)   # 在 s 之前结束的工作数
        dp[i] = max(dp[i - 1], dp[j] + p)     # 不做 vs 做
    return dp[-1]`,
  examples: [{ label: '4 个工作 → 120', args: { start: [1, 2, 3, 3], end: [3, 4, 5, 6], profit: [50, 10, 40, 70] } },
             { label: '5 个工作 → 150', args: { start: [1, 2, 3, 4, 6], end: [3, 5, 10, 6, 9], profit: [20, 20, 100, 70, 60] } },
             { label: '3 个工作 → 6', args: { start: [1, 1, 1], end: [2, 3, 4], profit: [5, 6, 4] } }],
  view: [760, 300],
  run({ start, end, profit }) {
    const F = [], jobs = start.map((s, i) => ({ s, e: end[i], p: profit[i] })).sort((a, b) => a.e - b.e);
    const ends = jobs.map(j => j.e), dp = Array(jobs.length + 1).fill(null); dp[0] = 0;
    const bis = (s, hi) => { let lo = 0; while (lo < hi) { const m = (lo + hi) >> 1; if (ends[m] <= s) lo = m + 1; else hi = m; } return lo; };
    const snap = (line, msg, ex = {}) => F.push({ line, msg, jobs, dp: [...dp], ...ex, vars: { dp: dp.map(v => v === null ? '·' : v).join('  '), ...(ex.v || {}) } });
    snap(2, '按结束时间排序。dp[i] = 只考虑前 i 个工作时能拿到的最大收益，dp[0] = 0。');
    for (let i = 1; i <= jobs.length; i++) {
      const { s, e, p } = jobs[i - 1];
      snap(5, `第 ${i} 个工作：时间 [${s}, ${e})，收益 ${p}。`, { cur: i - 1 });
      const j = bis(s, i - 1);
      snap(6, `二分：前 ${j} 个工作在 ${s} 之前结束，能和它兼容。`, { cur: i - 1, compat: j, v: { j } });
      const take = dp[j] + p, skip = dp[i - 1]; dp[i] = Math.max(take, skip);
      snap(7, `做它：dp[${j}] + ${p} = ${take}；不做：dp[${i - 1}] = ${skip}。所以 dp[${i}] = ${dp[i]}。`, { cur: i - 1, compat: j, v: { j, 做: take, 不做: skip } });
    }
    const chosen = []; let i = jobs.length;
    while (i > 0) { const { s, p } = jobs[i - 1], j = bis(s, i - 1); if (dp[i] === dp[j] + p) { chosen.push(i - 1); i = j; } else i--; }
    snap(8, `最大收益 ${dp[jobs.length]}。回溯 dp 得到选中的工作（绿色）。`, { chosen, done: true });
    return F;
  },
  render(f) {
    let s = ''; const tmin = Math.min(...f.jobs.map(j => j.s)), tmax = Math.max(...f.jobs.map(j => j.e));
    const X0 = 70, X1 = 730, sc = (X1 - X0) / (tmax - tmin), X = t => X0 + (t - tmin) * sc;
    f.jobs.forEach((jb, r) => {
      const y = 22 + r * 30;
      let cls = 'cell';
      if (f.compat !== undefined && r < f.compat) cls = 'acc';
      if (f.cur === r) cls = 'cur';
      if (f.chosen && f.chosen.includes(r)) cls = 'ok';

    });
    const ya = 22 + f.jobs.length * 30 + 6;
    s += `<line x1="${X0}" y1="${ya}" x2="${X1}" y2="${ya}" class="axis"/>`;
    for (let t = tmin; t <= tmax; t++) s += `<line x1="${X(t)}" y1="${ya - 4}" x2="${X(t)}" y2="${ya + 4}" class="tick"/>` + T(X(t), ya + 18, t, 'tm', MID);
    const yd = ya + 40;
    s += T(X0 - 12, yd + 22, 'dp', 'tl', END);
    f.dp.forEach((v, i) => {
      let cls = 'cell';
      if (f.compat === i) cls = 'acc';
      if (f.cur !== undefined && i === f.cur + 1) cls = 'cur';

      s += R(X0 + i * 62, yd, 54, 32, cls, 6) + T(X0 + i * 62 + 27, yd + 21, v === null ? '·' : v, 'tb', MID) + T(X0 + i * 62 + 27, yd + 48, i, 'tm', MID);

      s += `<line x1="${x1}" y1="${y1 + 14}" x2="${x2}" y2="${y2 - 14}" class="edge"/>`; }));

      if (n === f.r1) s += T(x, y - 20, 'region1', 'tm', MID);

{ id: '1298', title: 'Maximum Candies You Can Get from Boxes', short: 'Max Candies from Boxes', diff: 'H', freq: 83.9, both: false, slug: 'maximum-candies-you-can-get-from-boxes',
  idea: '<b>思路：</b>BFS 模拟。一个盒子要打开，必须同时满足“拥有它”和“它是开的或者有钥匙”。两个条件可能以任意顺序满足，所以拿到钥匙时和拿到盒子时都要检查一次，满足就入队。每个盒子最多打开一次。',
  code: `def maxCandies(status, candies, keys, containedBoxes, initialBoxes):
    have, opened, total = set(initialBoxes), set(), 0
    q = deque(b for b in initialBoxes if status[b])
    while q:
        b = q.popleft()
        if b in opened: continue
        opened.add(b); total += candies[b]
        for k in keys[b]:
            status[k] = 1
            if k in have and k not in opened: q.append(k)
        for c in containedBoxes[b]:
            have.add(c)
            if status[c] and c not in opened: q.append(c)
    return total`,
  examples: [{ label: '4 个盒子 → 16', args: { status: [1, 0, 1, 0], candies: [7, 5, 4, 100], keys: [[], [], [1], []], contained: [[1, 2], [3], [], []], initial: [0] } },

{ id: '631', title: 'Design Excel Sum Formula', short: 'Excel Sum Formula', diff: 'H', freq: 76.4, both: false, slug: 'design-excel-sum-formula',
  idea: '<b>思路：</b>公式格子不存结果，只存“引用了哪些格子、各引用几次”（Counter）。get 时递归求值，所以被引用的格子改了，公式自动跟着变；set 一个格子时要清掉它原来的公式。注意 "A1:B2" 和 "A1" 可以重叠，重叠的格子要算两次。',
  code: `class Excel:
    def __init__(self, height, width):
        self.val = {}                     # 格子 -> 数值
        self.formula = {}                 # 格子 -> Counter(引用格子 -> 次数)

    def set(self, row, col, v):
        self.formula.pop((row, col), None)
        self.val[(row, col)] = v

    def get(self, row, col):
        if (row, col) in self.formula:
            return sum(self.get(*cell) * k
                       for cell, k in self.formula[(row, col)].items())
        return self.val.get((row, col), 0)

    def sum(self, row, col, numbers):
        cnt = Counter()
        for ref in numbers:               # "A1" 或 "A1:B2"
            for cell in expand(ref):
                cnt[cell] += 1
        self.formula[(row, col)] = cnt
        return self.get(row, col)`,
  examples: [{ label: 'LeetCode 示例', args: { H: 3, W: 3, ops: [['set', 1, 'A', 2], ['sum', 3, 'C', ['A1', 'A1:B2']], ['set', 2, 'B', 2], ['get', 3, 'C']] } },
             { label: '公式引用公式', args: { H: 3, W: 3, ops: [['set', 1, 'A', 1], ['sum', 2, 'B', ['A1']], ['sum', 3, 'C', ['A1:B2']], ['set', 1, 'A', 5], ['get', 3, 'C']] } }],
  view: [760, 230],
  run({ H, W, ops }) {
    const F = [], val = {}, formula = {};
    const evalQ = k => formula[k] ? Object.entries(formula[k]).reduce((a, [c, m]) => a + evalQ(c) * m, 0) : (val[k] || 0);
    const disp = () => { const o = {}; for (let r = 1; r <= H; r++) for (let ci = 0; ci < W; ci++) { const k = String.fromCharCode(65 + ci) + r; o[k] = evalQ(k); } return o; };
    let curOp = `Excel(${H}, "${String.fromCharCode(64 + W)}")`;
    const snap = (line, msg, ex = {}) => F.push({ line, msg, H, W, disp: disp(), formula: JSON.parse(JSON.stringify(formula)), op: curOp, ...ex, vars: { 操作: curOp, ...(ex.v || {}) } });
    snap(2, `${curOp}：一个空表格，每格默认是 0。`);
    const evalFrames = (k, isSum) => {
      const total = evalQ(k); let acc = 0;
      if (formula[k]) {
        snap(11, `get ${k}：它是公式，按引用逐个求值。`, { cur: k, refs: formula[k] });
        for (const [c, m] of Object.entries(formula[k])) { const v = evalQ(c); acc += v * m;
          snap(12, `${c} = ${v}${formula[c] ? `（${c} 本身也是公式，递归求出）` : ''}${m > 1 ? `，被引用 ${m} 次，贡献 ${v * m}` : ''}，累计 ${acc}。`, { cur: k, refs: formula[k], hl: c, v: { 累计: acc } }); }
      } else snap(14, `get ${k}：普通数值 ${total}。`, { cur: k });
      snap(isSum ? 22 : 12, `${curOp} 返回 ${total}。`, { cur: k, refs: formula[k], v: { 返回: total } });
    };
    for (const op of ops) {
      curOp = fmtOp(op);
      if (op[0] === 'set') { const [, r, c, v] = op, k = c + r, had = !!formula[k]; delete formula[k]; val[k] = v;
        snap(had ? 7 : 8, `${curOp}：${k} = ${v}${had ? '，原来的公式被清掉' : ''}。引用 ${k} 的公式会自动跟着变。`, { cur: k }); }
      else if (op[0] === 'sum') { const [, r, c, refs] = op, k = c + r, cnt = {};
        for (const ref of refs) for (const cell of expand(ref)) { cnt[cell] = (cnt[cell] || 0) + 1;
          snap(20, `"${ref}" 展开出 ${cell}，${cell} 计数 ${cnt[cell]}。`, { cur: k, refs: { ...cnt }, hl: cell }); }
        formula[k] = cnt;
        snap(21, `${k} 存成公式 ${Object.entries(cnt).map(([c, m]) => m > 1 ? `${m}×${c}` : c).join(' + ')}。只存引用，不存结果。`, { cur: k, refs: cnt });
        evalFrames(k, true); }
      else evalFrames(op[2] + op[1], false);
    }

  },
  render(f) {

    for (let ci = 0; ci < f.W; ci++) s += T(X0 + ci * cw + cw / 2, Y0 - 6, String.fromCharCode(65 + ci), 'tm', MID);
    for (let r = 1; r <= f.H; r++) {
      s += T(X0 - 12, Y0 + (r - 1) * ch + 28, r, 'tm', END);
      for (let ci = 0; ci < f.W; ci++) {
        const k = String.fromCharCode(65 + ci) + r, x = X0 + ci * cw, y = Y0 + (r - 1) * ch, isF = !!f.formula[k];

        if (f.refs && f.refs[k] > 1) s += R(x + 4, y + 22, 26, 16, 'soft', 8) + T(x + 17, y + 34, `×${f.refs[k]}`, 'tm', MID);
        if (f.hl === k) s += R(x - 3, y - 3, cw + 2, ch + 2, 'mark', 6);

    }
    const fx = X0 + f.W * cw + 40; let fy = Y0 + 12;
    s += T(fx, fy, '公式（只存引用）', 'tl'); fy += 26;
    const fs = Object.entries(f.formula);
    if (!fs.length) s += T(fx, fy, '暂无', 'tm');

    return s;
  } },

/* ---------- app ---------- */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = { p: null, ex: 0, frames: [], i: 0, timer: null };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

function hl(line) {
  const e = esc(line), h = e.indexOf('#');
  const kw = t => t.replace(/\b(def|class|return|for|in|if|while|not|and|or|continue|None|True|False|lambda)\b/g, '<span class="kw">$1</span>');
  return h < 0 ? kw(e) : kw(e.slice(0, h)) + `<span class="cm">${e.slice(h)}</span>`;
}

function buildList() {
  const both = PROBLEMS.filter(p => p.both), rest = PROBLEMS.filter(p => !p.both);
  const item = p => `<button class="item" data-id="${p.id}"><span class="no">${p.id}</span><span class="nm">${esc(p.short || p.title)}${p.both ? ' <span class="star">★</span>' : ''}</span><span class="meta">${p.diff === 'H' ? 'Hard' : 'Medium'} · ${p.freq}%</span></button>`;
  $('#list').innerHTML = `<h2>两份清单都有</h2>${both.map(item).join('')}<h2>频率最高、还没做</h2>${rest.map(item).join('')}`;
  $('#list').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) select(b.dataset.id, 0); });
}

function select(id, ex) {
  const p = PROBLEMS.find(x => x.id === id) || PROBLEMS[0];
  S.p = p; S.ex = ex; S.frames = p.run(p.examples[ex].args); S.i = 0;
  store.set('airbnb-viz-p', p.id);
  if (location.hash !== '#p' + p.id) history.replaceState(null, '', '#p' + p.id);
  document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', b.dataset.id === p.id));
  $('#head').innerHTML = `<h2>${p.id}. ${esc(p.title)}</h2><span class="chip ${p.diff}">${p.diff === 'H' ? 'Hard' : 'Medium'}</span><span class="chip">频率 ${p.freq}%</span>${p.both ? '<span class="chip both">★ 面经也有</span>' : ''}<a href="https://leetcode.com/problems/${p.slug}/" target="_blank" rel="noopener">在 LeetCode 打开 ↗</a>`;
  $('#idea').innerHTML = p.idea;
  $('#examples').innerHTML = '<span>示例</span>' + p.examples.map((e, i) => `<button class="ex" data-i="${i}" aria-pressed="${i === ex}">${esc(e.label)}</button>`).join('');
  $('#code').innerHTML = p.code.split('\n').map((l, i) => `<div class="ln" data-n="${i + 1}"><span class="n">${i + 1}</span><span>${hl(l) || ' '}</span></div>`).join('');
  $('#scrub').max = S.frames.length - 1;
  stop(); draw();
  if (!reduced) play();
}

function draw() {
  const f = S.frames[S.i], p = S.p;
  $('#stage').innerHTML = `<svg viewBox="0 0 ${p.view[0]} ${p.view[1]}" role="img" aria-label="${esc(p.title)} 第 ${S.i + 1} 步">${DEFS}${p.render(f)}</svg>`;
  $('#msg').innerHTML = `<span class="stepn">STEP ${S.i + 1}</span>${esc(f.msg)}`;
  $('#count').textContent = `${S.i + 1} / ${S.frames.length}`;
  $('#scrub').value = S.i;
  const pane = $('#code');
  pane.querySelectorAll('.ln.on').forEach(x => x.classList.remove('on'));
  const ln = pane.querySelector(`.ln[data-n="${f.line}"]`);
  if (ln) { ln.classList.add('on'); const t = ln.offsetTop - pane.clientHeight / 2 + ln.clientHeight; pane.scrollTop = Math.max(0, t); }
  $('#vars').innerHTML = Object.entries(f.vars || {}).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
}

function go(i) { S.i = Math.max(0, Math.min(S.frames.length - 1, i)); draw(); }
function play() {
  if (S.i >= S.frames.length - 1) S.i = 0;
  stop(); $('#play').textContent = '暂停'; $('#play').setAttribute('aria-label', '暂停');
  const tick = () => { if (S.i >= S.frames.length - 1) { stop(); return; } go(S.i + 1); S.timer = setTimeout(tick, 1100 / +$('#speed').value); };
  S.timer = setTimeout(tick, 1100 / +$('#speed').value);
}
function stop() { clearTimeout(S.timer); S.timer = null; $('#play').textContent = '播放'; $('#play').setAttribute('aria-label', '播放'); }

$('#play').onclick = () => S.timer ? stop() : play();
$('#next').onclick = () => { stop(); go(S.i + 1); };
$('#prev').onclick = () => { stop(); go(S.i - 1); };
$('#reset').onclick = () => { stop(); go(0); };
$('#scrub').oninput = e => { stop(); go(+e.target.value); };
$('#examples').addEventListener('click', e => { const b = e.target.closest('.ex'); if (b) select(S.p.id, +b.dataset.i); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(S.i + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(S.i - 1); }
  else if (e.key === ' ' && !e.target.matches('button')) { e.preventDefault(); S.timer ? stop() : play(); }
});

buildList();
const fromHash = location.hash.replace('#p', '');
select(PROBLEMS.some(p => p.id === fromHash) ? fromHash : (store.get('airbnb-viz-p') || '751'), 0);
</script>
