<div class="wrap">

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T = (x, y, s, cls = '', a = '') => `<text x="${x}" y="${y}" ${cls ? `class="${cls}"` : ''} ${a}>${esc(s)}</text>`;
const R = (x, y, w, h, cls, rx = 6) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${cls}"/>`;
const MID = 'text-anchor="middle"', END = 'text-anchor="end"';
const DIFF = { E: 'Easy', M: 'Medium', H: 'Hard' };
const DEFS = `<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker>
 <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp2"/></marker></defs>`;

/* ---------- 751 IP to CIDR ---------- */
const ipInt = ip => ip.split('.').reduce((a, o) => a * 256 + Number(o), 0);
const intIp = x => [3, 2, 1, 0].map(k => Math.floor(x / 256 ** k) % 256).join('.');
const lowbit = x => { if (x === 0) return 2 ** 32; let s = 1; while (x % (s * 2) === 0) s *= 2; return s; };

/* ---------- 1257 tree layout ---------- */
function layoutTree(regions) {
  const kids = {}, par = {};
  regions.forEach(([b, ...s]) => { kids[b] = (kids[b] || []).concat(s); s.forEach(x => par[x] = b); });
  const root = regions.map(r => r[0]).find(n => !par[n]);
  const pos = {}; let leaf = 0, depth = 0;
  (function walk(n, d) {
    depth = Math.max(depth, d);
    const ch = kids[n] || [];
    if (!ch.length) pos[n] = { x: leaf++, d };
    else { ch.forEach(c => walk(c, d + 1)); pos[n] = { x: (pos[ch[0]].x + pos[ch[ch.length - 1]].x) / 2, d }; }
  })(root, 0);
  return { pos, par, leaves: leaf, depth };
}

/* ---------- 631 helpers ---------- */
function expand(ref) {
  const [a, b] = ref.split(':'), p = s => ({ c: s.charCodeAt(0), r: +s.slice(1) });
  const A = p(a), B = b ? p(b) : A, out = [];
  for (let r = A.r; r <= B.r; r++) for (let c = A.c; c <= B.c; c++) out.push(String.fromCharCode(c) + r);
  return out;
}
const fmtOp = op => `${op[0]}(${op.slice(1).map(x => JSON.stringify(x)).join(', ')})`;

const PROBLEMS = [
/* ======================================================================= */
{ id: '751', title: 'IP to CIDR', diff: 'M', freq: 71.3, both: true, slug: 'ip-to-cidr',
  idea: '<b>思路：</b>每次从当前地址 x 出发，取最大的“对齐”块。块大小是 x 的最低位 1（x &amp; −x），但不能超过剩余要覆盖的数量 n，超过就减半。一个大小为 2^k 的块就是前缀长度 32 − k 的 CIDR。',
  code: `def ipToCIDR(ip, n):
    x = ip_to_int(ip)
    res = []
    while n > 0:
        step = x & -x              # 最低位的 1：x 处最大的对齐块
        while step > n:
            step //= 2
        res.append(f"{int_to_ip(x)}/{33 - step.bit_length()}")
        x += step
        n -= step
    return res`,
  examples: [{ label: '255.0.0.7, n=10', args: { ip: '255.0.0.7', n: 10 } },
             { label: '117.145.102.62, n=8', args: { ip: '117.145.102.62', n: 8 } },
             { label: '192.168.1.5, n=9', args: { ip: '192.168.1.5', n: 9 } }],
  view: [760, 250],
  run({ ip, n }) {
    const F = [], start = ipInt(ip), total = n; let x = start; const res = [];
    const snap = (line, msg, ex = {}) => F.push({ line, msg, x, n, start, total, res: res.map(r => ({ ...r })), ...ex,
      vars: { x: `${x}  (${intIp(x)})`, n, step: ex.step ?? '—', res: res.map(r => r.cidr).join('  ') || '[]' } });
    snap(2, `把 ${ip} 转成 32 位整数 x = ${x}，要覆盖 n = ${n} 个地址。`);
    while (n > 0) {
      let step = lowbit(x);
      snap(5, `x 的最低位 1 是 2^${Math.log2(step)} = ${step}：从 x 开始，最大的对齐块有 ${step} 个地址。`, { step, cand: step, lb: true });
      while (step > n) { step /= 2; snap(7, `${step * 2} 超过剩余的 n = ${n}，减半为 ${step}。`, { step, cand: step }); }
      const len = 32 - Math.log2(step);
      res.push({ off: x - start, size: step, cidr: `${intIp(x)}/${len}` });
      snap(8, `输出 ${intIp(x)}/${len}：前 ${len} 位固定，后 ${32 - len} 位任意，正好 ${step} 个地址。`, { step });
      x += step; n -= step;
      snap(10, `x 前进到 ${intIp(x)}，还剩 n = ${n}。`);
    }
    snap(11, `完成：${res.length} 个 CIDR 块恰好覆盖这 ${total} 个地址。`, { done: true });
    return F;
  },
  render(f) {
    let s = T(20, 18, 'x 的 32 位（青色 = 当前块里可以任意取值的主机位，琥珀色框 = 最低位的 1）', 'tl');
    const k = f.step ? Math.log2(f.step) : -1, lb = Math.log2(lowbit(f.x));
    for (let i = 31; i >= 0; i--) {
      const col = 31 - i, X = 20 + col * 21 + Math.floor(col / 8) * 12, bit = Math.floor(f.x / 2 ** i) % 2;
      s += R(X, 40, 18, 26, i < k ? 'acc' : 'cell', 4) + T(X + 9, 58, bit, bit ? 'tb' : 'tm', MID);
      if (f.lb && i === lb) s += R(X - 2, 38, 22, 30, 'mark', 5);
    }
    for (let o = 0; o < 4; o++) s += T(20 + o * 180 + 84, 84, Math.floor(f.x / 256 ** (3 - o)) % 256, 'tm', MID);
    const X0 = 20, W = 708, sc = W / f.total, Y = 112;
    s += T(20, Y - 8, `要覆盖的 ${f.total} 个地址`, 'tl') + R(X0, Y, W, 34, 'cell', 4);
    f.res.forEach((r, i) => {
      s += R(X0 + r.off * sc, Y, r.size * sc, 34, 'ok', 3);
      if (r.size * sc > 70) s += T(X0 + (r.off + r.size / 2) * sc, Y + 21, r.cidr, '', MID);
    });
    if (f.cand) { const off = f.x - f.start, x = X0 + off * sc, w = Math.min(f.cand * sc, X0 + W + 24 - x);
      s += `<rect x="${x}" y="${Y - 4}" width="${w}" height="42" rx="4" class="cand"/>`;
      if (off + f.cand > f.total) s += T(X0 + W, Y + 56, `候选块 ${f.cand} > 剩余 ${f.n}`, 'tm', END); }
    s += T(X0, Y + 56, intIp(f.start), 'tm') ;
    s += T(20, 200, '输出', 'tl');
    let cx = 60; f.res.forEach(r => { const w = r.cidr.length * 7.4 + 16; if (cx + w > 740) return; s += R(cx, 186, w, 24, 'ok', 12) + T(cx + w / 2, 202, r.cidr, '', MID); cx += w + 8; });
    return s;
  } },

/* ======================================================================= */
{ id: '1058', title: 'Minimize Rounding Error to Meet Target', short: 'Minimize Rounding Error', diff: 'M', freq: 69.3, both: true, slug: 'minimize-rounding-error-to-meet-target',
  idea: '<b>思路：</b>先全部向下取整，差多少就必须有 k 个数向上取整。向上取整的误差是 1 − f，向下取整是 f，所以应该把小数部分 f 最大的 k 个数向上取整。k 不在 [0, 非整数个数] 内就无解。面经里叫 <b>Round Prices</b>。',
  code: `def minimizeError(prices, target):
    fl = [floor(float(p)) for p in prices]
    fr = [float(p) - f for p, f in zip(prices, fl)]
    k = target - sum(fl)                  # 需要向上取整的个数
    fracs = sorted((f for f in fr if f > 0), reverse=True)
    if k < 0 or k > len(fracs): return "-1"
    err = sum(1 - f for f in fracs[:k]) + sum(fracs[k:])
    return f"{err:.3f}"`,
  examples: [{ label: '[0.7, 2.8, 4.9] → 8', args: { prices: ['0.700', '2.800', '4.900'], target: 8 } },
             { label: '[2.3, 1.1, 4.7, 0.9] → 9', args: { prices: ['2.300', '1.100', '4.700', '0.900'], target: 9 } },
             { label: '[1.5, 2.5, 3.5] → 10', args: { prices: ['1.500', '2.500', '3.500'], target: 10 } }],
  view: [760, 300],
  run({ prices, target }) {
    const F = [], rows = prices.map(p => ({ p, fl: null, fr: null, d: null }));
    let k = null, err = null, order = rows.map((_, i) => i);
    const snap = (line, msg, ex = {}) => F.push({ line, msg, rows: rows.map(r => ({ ...r })), order: [...order], k, err, target, ...ex,
      vars: { target, 'sum(fl)': rows.every(r => r.fl !== null) ? rows.reduce((a, r) => a + r.fl, 0) : '…', k: k ?? '…', err: err === null ? '…' : err.toFixed(3) } });
    snap(1, `目标和是 ${target}。每个价格只能取 floor 或 ceil，要让总误差最小。`);
    rows.forEach((r, i) => { r.fl = Math.floor(+r.p); r.fr = +((+r.p) - r.fl).toFixed(3);
      snap(2, `${r.p} 向下是 ${r.fl}，小数部分 f = ${r.fr.toFixed(3)}。`, { cur: i }); });
    const F0 = rows.reduce((a, r) => a + r.fl, 0); k = target - F0;
    snap(4, `全部向下取整的和是 ${F0}，所以必须有 k = ${target} − ${F0} = ${k} 个数向上取整。`);
    const nonint = rows.map((_, i) => i).filter(i => rows[i].fr > 0);
    order = [...nonint].sort((a, b) => rows[b].fr - rows[a].fr).concat(rows.map((_, i) => i).filter(i => rows[i].fr === 0));

{ id: '756', title: 'Pyramid Transition Matrix', short: 'Pyramid Transition', diff: 'M', freq: 69.3, both: true, slug: 'pyramid-transition-matrix',
  idea: '<b>思路：</b>回溯。在当前这一行上面，从左到右一块一块地放：每个位置只能放 allowed 里“下面两块 → 上面一块”允许的字母。一行放满就递归往上；放不下就回溯。把已经证明搭不上去的行记进 bad，避免重复搜索。',
  code: `def pyramidTransition(bottom, allowed):
    up = defaultdict(list)
    for a, b, c in allowed:
        up[a + b].append(c)
    bad = set()                          # 已证明搭不上去的行

    def solve(row):
        if len(row) == 1:
            return True
        if row in bad:
            return False
        if fill(row, 0, ""):
            return True
        bad.add(row)
        return False

    def fill(row, i, cur):               # 一块一块地搭上一行
        if i == len(row) - 1:
            return solve(cur)
        for c in up[row[i:i + 2]]:
            if fill(row, i + 1, cur + c):
                return True
        return False

    return solve(bottom)`,
  examples: [{ label: 'BCD → True', args: { bottom: 'BCD', allowed: ['BCC', 'CDE', 'CEA', 'FFF'] } },
             { label: 'AAAA → False', args: { bottom: 'AAAA', allowed: ['AAB', 'AAC', 'BCD', 'BBE', 'DEF'] } },
             { label: 'ABC → True（要回溯）', args: { bottom: 'ABC', allowed: ['ABD', 'ABE', 'BCF', 'EFG'] } }],
  view: [760, 300],
  run({ bottom, allowed }) {
    const F = [], up = {}, levels = [bottom], bad = new Set(); let cap = false;
    allowed.forEach(s => (up[s[0] + s[1]] ||= []).push(s[2]));
    const table = Object.entries(up).map(([k, v]) => `${k}→${v.join('/')}`).join('  ');
    const snap = (line, msg, ex = {}, force) => { if (F.length >= 400 && !force) { cap = true; return; }
      F.push({ line, msg, levels: [...levels], n: bottom.length, ...ex, vars: { 查找表: table, 层: levels.length - 1, bad: [...bad].join(', ') || '∅' } }); };
    snap(4, `把 allowed 建成查找表：下面两块 → 上面可以放哪些字母。`);
    function solve(L) {
      const row = levels[L];
      if (row.length === 1) { snap(9, `搭到塔顶 "${row}"，成功。`, { win: true }); return true; }
      if (bad.has(row)) { snap(11, `"${row}" 之前已证明搭不上去，直接返回 False（记忆化剪枝）。`, { badRow: L }); return false; }
      levels[L + 1] = '';
      if (fill(L, 0)) return true;
      levels.length = L + 1; bad.add(row);
      snap(14, `"${row}" 上面怎么放都搭不出来，记入 bad。`, { badRow: L }); return false;
    }
    function fill(L, i) {
      const row = levels[L];
      if (i === row.length - 1) { snap(19, `第 ${L + 1} 层 "${levels[L + 1]}" 放满了，递归往上搭。`, { rowDone: L + 1 });
        const ok = solve(L + 1); if (!ok) levels.length = L + 2; return ok; }
      const pair = row.slice(i, i + 2), cands = up[pair] || [];
      if (!cands.length) snap(20, `"${pair}" 上面没有允许的块。`, { cell: [L + 1, i], pair: [L, i], st: 'bad' });
      for (const c of cands) {
        levels[L + 1] = levels[L + 1].slice(0, i) + c;
        snap(20, `在 "${pair}" 上面试放 ${c}。`, { cell: [L + 1, i], pair: [L, i], st: 'cur' });
        if (fill(L, i + 1)) return true;
        levels[L + 1] = levels[L + 1].slice(0, i);
        snap(21, `放 ${c} 走不通，回溯。`, { cell: [L + 1, i], pair: [L, i], st: 'bad' });
      }
      return false;
    }
    const ok = solve(0);
    snap(25, (ok ? '返回 True。' : '返回 False：无论怎么放都到不了塔顶。') + (cap ? '（搜索步数太多，动画只展示前 400 步）' : ''), { final: ok }, true);
    return F;
  },
  render(f) {
    let s = ''; const n = f.n, C = 52, cx = 380, base = 250;
    for (let L = 0; L < n; L++) {
      const cnt = n - L, row = f.levels[L] || '', y = base - L * (C + 4);
      for (let i = 0; i < cnt; i++) {
        const x = cx - (cnt * (C + 4)) / 2 + i * (C + 4), ch = row[i] || '';
        let cls = L === 0 ? 'cell' : ch ? 'acc' : 'ghost';
        if (f.badRow === L && ch) cls = 'bad';
        if (f.cell && f.cell[0] === L && f.cell[1] === i) cls = f.st;
        if ((f.win || f.final) && ch) cls = 'ok';
        if (f.final === false && L === 0) cls = 'bad';
        s += R(x, y, C, C, cls, 6) + (ch ? T(x + C / 2, y + C / 2 + 7, ch, 'big', MID) : '');
      }
    }
    if (f.pair) { const [L, i] = f.pair, cnt = n - L, y = base - L * (C + 4), x = cx - (cnt * (C + 4)) / 2 + i * (C + 4);
      s += `<rect x="${x - 3}" y="${y - 3}" width="${2 * C + 10}" height="${C + 6}" rx="8" class="mark"/>`; }
    s += T(20, 24, '底层固定；青色 = 已放的块，琥珀色 = 正在尝试，红色 = 回溯', 'tl');
    return s;
  } },

{ id: '1235', title: 'Maximum Profit in Job Scheduling', short: 'Max Profit Job Scheduling', diff: 'H', freq: 92.4, both: false, slug: 'maximum-profit-in-job-scheduling',
  idea: '<b>思路：</b>按结束时间排序，dp[i] = 只考虑前 i 个工作时的最大收益。对第 i 个工作：不做就是 dp[i−1]；做的话，用二分找出在它开始前就结束的工作有 j 个，收益是 dp[j] + profit。两者取大。O(n log n)。',
  code: `def jobScheduling(startTime, endTime, profit):
    jobs = sorted(zip(endTime, startTime, profit))
    ends = [e for e, _, _ in jobs]
    dp = [0] * (len(jobs) + 1)
    for i, (e, s, p) in enumerate(jobs, 1):
        j = bisect_right(ends, s, 0, i - 1)   # 在 s 之前结束的工作数
        dp[i] = max(dp[i - 1], dp[j] + p)     # 不做 vs 做
    return dp[-1]`,
  examples: [{ label: '4 个工作 → 120', args: { start: [1, 2, 3, 3], end: [3, 4, 5, 6], profit: [50, 10, 40, 70] } },
             { label: '5 个工作 → 150', args: { start: [1, 2, 3, 4, 6], end: [3, 5, 10, 6, 9], profit: [20, 20, 100, 70, 60] } },
             { label: '3 个工作 → 6', args: { start: [1, 1, 1], end: [2, 3, 4], profit: [5, 6, 4] } }],
  view: [760, 300],
  run({ start, end, profit }) {
    const F = [], jobs = start.map((s, i) => ({ s, e: end[i], p: profit[i] })).sort((a, b) => a.e - b.e);
    const ends = jobs.map(j => j.e), dp = Array(jobs.length + 1).fill(null); dp[0] = 0;
    const bis = (s, hi) => { let lo = 0; while (lo < hi) { const m = (lo + hi) >> 1; if (ends[m] <= s) lo = m + 1; else hi = m; } return lo; };
    const snap = (line, msg, ex = {}) => F.push({ line, msg, jobs, dp: [...dp], ...ex, vars: { dp: dp.map(v => v === null ? '·' : v).join('  '), ...(ex.v || {}) } });
    snap(2, '按结束时间排序。dp[i] = 只考虑前 i 个工作时能拿到的最大收益，dp[0] = 0。');
    for (let i = 1; i <= jobs.length; i++) {
      const { s, e, p } = jobs[i - 1];
      snap(5, `第 ${i} 个工作：时间 [${s}, ${e})，收益 ${p}。`, { cur: i - 1 });
      const j = bis(s, i - 1);
      snap(6, `二分：前 ${j} 个工作在 ${s} 之前结束，能和它兼容。`, { cur: i - 1, compat: j, v: { j } });
      const take = dp[j] + p, skip = dp[i - 1]; dp[i] = Math.max(take, skip);
      snap(7, `做它：dp[${j}] + ${p} = ${take}；不做：dp[${i - 1}] = ${skip}。所以 dp[${i}] = ${dp[i]}。`, { cur: i - 1, compat: j, v: { j, 做: take, 不做: skip } });
    }
    const chosen = []; let i = jobs.length;
    while (i > 0) { const { s, p } = jobs[i - 1], j = bis(s, i - 1); if (dp[i] === dp[j] + p) { chosen.push(i - 1); i = j; } else i--; }
    snap(8, `最大收益 ${dp[jobs.length]}。回溯 dp 得到选中的工作（绿色）。`, { chosen, done: true });
    return F;
  },
  render(f) {
    let s = ''; const tmin = Math.min(...f.jobs.map(j => j.s)), tmax = Math.max(...f.jobs.map(j => j.e));
    const X0 = 70, X1 = 730, sc = (X1 - X0) / (tmax - tmin), X = t => X0 + (t - tmin) * sc;
    f.jobs.forEach((jb, r) => {
      const y = 22 + r * 30;

      if (f.cur === r) cls = 'cur';
      if (f.chosen && f.chosen.includes(r)) cls = 'ok';

    });
    const ya = 22 + f.jobs.length * 30 + 6;
    s += `<line x1="${X0}" y1="${ya}" x2="${X1}" y2="${ya}" class="axis"/>`;
    for (let t = tmin; t <= tmax; t++) s += `<line x1="${X(t)}" y1="${ya - 4}" x2="${X(t)}" y2="${ya + 4}" class="tick"/>` + T(X(t), ya + 18, t, 'tm', MID);
    const yd = ya + 40;
    s += T(X0 - 12, yd + 22, 'dp', 'tl', END);
    f.dp.forEach((v, i) => {
      let cls = 'cell';
      if (f.compat === i) cls = 'acc';
      if (f.cur !== undefined && i === f.cur + 1) cls = 'cur';

      s += `<line x1="${x1}" y1="${y1 + 14}" x2="${x2}" y2="${y2 - 14}" class="edge"/>`; }));

{ id: '1298', title: 'Maximum Candies You Can Get from Boxes', short: 'Max Candies from Boxes', diff: 'H', freq: 83.9, both: false, slug: 'maximum-candies-you-can-get-from-boxes',
  idea: '<b>思路：</b>BFS 模拟。一个盒子要打开，必须同时满足“拥有它”和“它是开的或者有钥匙”。两个条件可能以任意顺序满足，所以拿到钥匙时和拿到盒子时都要检查一次，满足就入队。每个盒子最多打开一次。',
  code: `def maxCandies(status, candies, keys, containedBoxes, initialBoxes):

{ id: '631', title: 'Design Excel Sum Formula', short: 'Excel Sum Formula', diff: 'H', freq: 76.4, both: false, slug: 'design-excel-sum-formula',

  code: `class Excel:
    def __init__(self, height, width):
        self.val = {}                     # 格子 -> 数值
        self.formula = {}                 # 格子 -> Counter(引用格子 -> 次数)

    def set(self, row, col, v):
        self.formula.pop((row, col), None)
        self.val[(row, col)] = v

    def get(self, row, col):
        if (row, col) in self.formula:
            return sum(self.get(*cell) * k
                       for cell, k in self.formula[(row, col)].items())
        return self.val.get((row, col), 0)

    def sum(self, row, col, numbers):
        cnt = Counter()
        for ref in numbers:               # "A1" 或 "A1:B2"
            for cell in expand(ref):
                cnt[cell] += 1
        self.formula[(row, col)] = cnt
        return self.get(row, col)`,
  examples: [{ label: 'LeetCode 示例', args: { H: 3, W: 3, ops: [['set', 1, 'A', 2], ['sum', 3, 'C', ['A1', 'A1:B2']], ['set', 2, 'B', 2], ['get', 3, 'C']] } },

{ id: '251', title: 'Flatten 2D Vector', diff: 'M', freq: 85.9, solved: true, slug: 'flatten-2d-vector',
  idea: '<b>思路：</b>两个指针：i1 指向第几个子列表，i2 指向子列表里的第几个。关键是 _moveToValid：构造时和每次 next 之后，都把指针推到下一个真实存在的元素，跳过空列表和已经用完的列表。这样 hasNext 只要看 i1 有没有越界。',
  code: `class Vector2D(object):
    def __init__(self, vec2d):
        self.vec2d = vec2d
        self.i1 = 0 # outer level index
        self.i2 = 0 # inner level index
        self._moveToValid()

    def _moveToValid(self):
        while self.i1 < len(self.vec2d) and self.i2 >= len(self.vec2d[self.i1]):
            self.i1 += 1
            self.i2 = 0

    def next(self):
        ret = self.vec2d[self.i1][self.i2]
        self.i2 += 1
        self._moveToValid()
        return ret

    def hasNext(self):
        return self.i1 < len(self.vec2d)`,

{ id: '269', title: 'Alien Dictionary', diff: 'H', freq: 74.8, solved: true, slug: 'alien-dictionary',
  idea: '<b>思路：</b>相邻两个单词第一个不同的字母给出一条顺序 x → y。所有约束建成图后做 BFS 拓扑排序（Kahn）：反复取出入度为 0 的字母。排不完说明有环，返回 ""；前一个单词是后一个的更长前缀（"abc" 排在 "ab" 前）也非法。<br><b>注意：</b>repo 里 <code>269_alien_dictionary.py</code> 的拓扑部分只在所有约束连成一条链时正确：一个字母有多个前驱、或有不出现在约束里的字母时，会排错甚至死循环。这里演示的是标准写法。',
  code: `def alienOrder(words):
    graph = {c: set() for w in words for c in w}
    indeg = {c: 0 for c in graph}
    for a, b in zip(words, words[1:]):
        for x, y in zip(a, b):
            if x != y:                      # 第一个不同的字母：x 在 y 前面
                if y not in graph[x]:
                    graph[x].add(y); indeg[y] += 1
                break
        else:
            if len(a) > len(b): return ""   # "abc" 排在 "ab" 前面，非法
    q = deque(c for c in graph if indeg[c] == 0)
    order = []
    while q:
        c = q.popleft(); order.append(c)
        for d in graph[c]:
            indeg[d] -= 1
            if indeg[d] == 0: q.append(d)
    return "".join(order) if len(order) == len(graph) else ""`,
  examples: [{ label: 'wrt … rftt → "wertf"', args: { words: ['wrt', 'wrf', 'er', 'ett', 'rftt'] } },
             { label: 'z, x, z → ""（有环）', args: { words: ['z', 'x', 'z'] } },

  run({ words }) {
    const F = [], chars = []; words.forEach(w => [...w].forEach(c => { if (!chars.includes(c)) chars.push(c); }));

    let order = [], q = [];

    while (q.length) {

    return F;

{ id: '295', title: 'Find Median from Data Stream', short: 'Median from Data Stream', diff: 'H', freq: null, solved: true, slug: 'find-median-from-data-stream',
  idea: '<b>思路：</b>两个堆把数据分成两半：maxHeap（存负数）装较小的一半，minHeap 装较大的一半，并保持 maxHeap 最多比 minHeap 多 1 个。中位数只看两个堆顶。新数先进 maxHeap；如果它比 minHeap 堆顶还大，或者 maxHeap 多太多，就把 maxHeap 堆顶挪过去，最后再平衡个数。<br><b>注意：</b>第 10 行在 minHeap 为空时比较 <code>None &lt; 数字</code>，只有 Python 2 能跑（结果为 True），动画按这个语义演示。Python 3 要写成 <code>(minTop is not None and minTop &lt; -maxTop) or …</code>。',
  code: `class MedianFinder:
    def __init__(self):
        self.minHeap = []
        self.maxHeap = []

    def addNum(self, num):
        heappush(self.maxHeap, -num)
        minTop = self.minHeap[0] if len(self.minHeap) else None
        maxTop = self.maxHeap[0] if len(self.maxHeap) else None
        if minTop < -maxTop or len(self.minHeap) + 1 < len(self.maxHeap):
            heappush(self.minHeap, -heappop(self.maxHeap))
        if len(self.maxHeap) < len(self.minHeap):
            heappush(self.maxHeap, -heappop(self.minHeap))

    def findMedian(self):
        if len(self.minHeap) < len(self.maxHeap):
            return -1.0 * self.maxHeap[0]
        else:
            return (self.minHeap[0] - self.maxHeap[0]) / 2.0`,
  examples: [{ label: 'add 1, 2 → 1.5；add 3 → 2', args: { ops: [['add', 1], ['add', 2], ['med'], ['add', 3], ['med']] } },
             { label: '5, 15, 1, 3, 8, 7', args: { ops: [['add', 5], ['med'], ['add', 15], ['med'], ['add', 1], ['med'], ['add', 3], ['med'], ['add', 8], ['med'], ['add', 7], ['med']] } }],

        if (c1 || c2) { const m = Math.max(...lo); lo.splice(lo.indexOf(m), 1); hi.push(m); snap(11, `把 maxHeap 堆顶 ${m} 挪到 minHeap。`, { cur: m }); }
        if (lo.length < hi.length) { const m = Math.min(...hi); hi.splice(hi.indexOf(m), 1); lo.push(m); snap(13, `minHeap 比 maxHeap 多，把它的堆顶 ${m} 挪回来。`, { cur: m }); }
      } else {

      }

{ id: '336', title: 'Palindrome Pairs', diff: 'H', freq: 84.9, solved: true, slug: 'palindrome-pairs',
  idea: '<b>思路：</b>建哈希表 单词 → 下标。把每个单词切成 left + right：如果 left 是回文，并且 right 的反转在表里，那么 reverse(right) + word 是回文；如果 right 是回文，并且 left 的反转在表里，那么 word + reverse(left) 是回文。整词反转和空串单独处理。复杂度 O(n·k²)。（repo 里是 Python 2 的 <code>size / 2</code>，这里写成 <code>//</code>。）',
  code: `class Solution(object):
    def palindromePairs(self, words):
        wmap = {y : x for x, y in enumerate(words)}

        def isPalindrome(word):
            size = len(word)
            for x in range(size // 2):
                if word[x] != word[size - x - 1]:
                    return False
            return True

        ans = set()
        for idx, word in enumerate(words):
            if "" in wmap and word != "" and isPalindrome(word):
                bidx = wmap[""]
                ans.add((bidx, idx))
                ans.add((idx, bidx))

            rword = word[::-1]
            if rword in wmap:
                ridx = wmap[rword]
                if idx != ridx:
                    ans.add((idx, ridx))
                    ans.add((ridx, idx))

            for x in range(1, len(word)):
                left, right = word[:x], word[x:]
                rleft, rright = left[::-1], right[::-1]
                if isPalindrome(left) and rright in wmap:
                    ans.add((wmap[rright], idx))
                if isPalindrome(right) and rleft in wmap:
                    ans.add((idx, wmap[rleft]))
        return list(ans)`,
  examples: [{ label: 'abcd, dcba, lls, s, sssll', args: { words: ['abcd', 'dcba', 'lls', 's', 'sssll'] } },
             { label: 'bat, tab, cat', args: { words: ['bat', 'tab', 'cat'] } },
             { label: 'a, ""', args: { words: ['a', ''] } }],
  view: [760, 300],
  run({ words }) {
    const F = [], wmap = new Map(words.map((w, i) => [w, i])), ans = [];
    const add = (a, b) => { if (!ans.some(p => p[0] === a && p[1] === b)) ans.push([a, b]); };
    const rev = w => [...w].reverse().join(''), isPal = w => w === rev(w);
    const snap = (line, msg, ex = {}) => F.push({ line, msg, words, ans: ans.map(p => [...p]), ...ex,
      vars: { wmap: [...wmap].map(([w, i]) => `"${w}":${i}`).join(' '), ans: ans.map(p => `[${p}]`).join(' ') || '∅' } });
    snap(3, '先建哈希表：单词 → 下标。');
    words.forEach((word, idx) => {
      snap(13, `看第 ${idx} 个单词 "${word}"。`, { cur: idx });
      if (wmap.has('') && word !== '' && isPal(word)) { const b = wmap.get(''); add(b, idx); add(idx, b);
        snap(17, `"${word}" 本身是回文，和空串 "" 两种顺序都能拼成回文。`, { cur: idx, pairs: [[b, idx], [idx, b]] }); }
      const rw = rev(word);
      if (wmap.has(rw) && wmap.get(rw) !== idx) { const r = wmap.get(rw); add(idx, r); add(r, idx);
        snap(24, `整词反转 "${rw}" 在表里（下标 ${r}），两种顺序都是回文。`, { cur: idx, partner: r, pairs: [[idx, r], [r, idx]] }); }
      else snap(20, `整词反转 "${rw}" ${wmap.has(rw) ? '就是它自己' : '不在表里'}。`, { cur: idx });
      for (let x = 1; x < word.length; x++) {
        const L = word.slice(0, x), Rr = word.slice(x), rl = rev(L), rr = rev(Rr);
        const a = isPal(L) && wmap.has(rr), b = isPal(Rr) && wmap.has(rl), pairs = [];
        if (a) { add(wmap.get(rr), idx); pairs.push([wmap.get(rr), idx]); }
        if (b) { add(idx, wmap.get(rl)); pairs.push([idx, wmap.get(rl)]); }
        const d1 = `left "${L}" ${isPal(L) ? `是回文，"${rr}" ${wmap.has(rr) ? '在' : '不在'}表里` : '不是回文'}`;
        const d2 = `right "${Rr}" ${isPal(Rr) ? `是回文，"${rl}" ${wmap.has(rl) ? '在' : '不在'}表里` : '不是回文'}`;
        snap(a ? 30 : b ? 32 : 27, `切成 "${L}" | "${Rr}"：${d1}；${d2}。`, { cur: idx, split: x, pairs, la: isPal(L), rb: isPal(Rr) });
      }
    });
    snap(33, `共 ${ans.length} 对：${ans.map(p => `[${p}]`).join(' ')}。`, { done: true });
    return F;
  },
  render(f) {

    f.words.forEach((w, i) => {

{ id: '374', title: 'Guess Number Higher or Lower', short: 'Guess Number', diff: 'E', freq: null, solved: true, slug: 'guess-number-higher-or-lower',
  idea: '<b>思路：</b>标准二分查找：每次猜区间中点，按 guess 的反馈丢掉一半，最多 ⌈log₂(n+1)⌉ 次。面经里的 Guess Number 是它的变体（猜一个多位数，反馈“几位对”）。（repo 里是 Python 2 的 <code>/</code>，这里写成 <code>//</code>；另外每轮调用了两次 guess，可以先存起来。）',
  code: `class Solution(object):
    def guessNumber(self, n):
        left, right = 1, n

            mid = (left + right) // 2
            if guess(mid) == 1:
                left = mid + 1
            elif guess(mid) == -1:
                right = mid - 1
            else:
                return mid`,

             { label: 'n=100，答案 1', args: { n: 100, pick: 1 } },

{ id: '755', title: 'Pour Water', diff: 'M', freq: 79.2, solved: true, slug: 'pour-water',
  idea: '<b>思路：</b>一滴一滴模拟。每滴水从 K 出发：先往左走，只要左边不更高就继续；再往右走；如果最后停在 K 的右边，再在平地上尽量退回左边。三个 while 合起来恰好实现“优先往左流到更低处，否则往右，否则留在原地”。复杂度 O(V·n)。',
  code: `class Solution(object):
    def pourWater(self, heights, V, K):
        for _ in range(V):
            curr = K
            while curr > 0 and heights[curr] >= heights[curr - 1]:
                curr -= 1
            while curr < len(heights) - 1 and heights[curr] >= heights[curr + 1]:
                curr += 1
            while curr > K and heights[curr] >= heights[curr - 1]:
                curr -= 1
            heights[curr] += 1
        return heights`,
  examples: [{ label: '[2,1,1,2,1,2,2], V=4, K=3', args: { heights: [2, 1, 1, 2, 1, 2, 2], V: 4, K: 3 } },

      while (c > 0 && h[c] >= h[c - 1]) { c--; snap(6, `左边高度 ${h[c]} 不超过 ${h[c + 1]}，往左流到 ${c}。`, { curr: c }); }

{ id: '773', title: 'Sliding Puzzle', diff: 'H', freq: 77.8, solved: true, slug: 'sliding-puzzle',
  idea: '<b>思路：</b>把 2×3 的棋盘压成字符串，每个字符串是一个状态，0 是空格。从起点做 BFS，每一步把 0 和上下左右的格子交换；第一次遇到 "123450" 时的层数就是最少步数。一共只有 6! = 720 种排列，其中一半可达。（为了回放路径，动画额外记录了每个状态的父状态，repo 的代码不需要这个。）',
  code: `class Solution(object):
    def slidingPuzzle(self, board):
        goal = "123450"
        start = "".join(str(c) for row in board for c in row)
        q = collections.deque([(start, 0)])
        visited = set([start])
        dirs = [[0,1],[0,-1],[1,0],[-1,0]]
        while q:
            path, step = q.popleft()
            if path == goal:
                return step
            pos = path.index('0')
            i, j = pos // 3, pos % 3
            path = list(path)
            for d in dirs:
                x, y = i + d[0], j + d[1]
                if x < 0 or x >= 2 or y < 0 or y >= 3:
                    continue
                path[x*3+y], path[i*3+j] = path[i*3+j], path[x*3+y]
                pathstr = ''.join(path)
                if pathstr not in visited:
                    q.append((pathstr, step + 1))
                    visited.add(pathstr)
                path[x*3+y], path[i*3+j] = path[i*3+j], path[x*3+y]
        return -1`,
  examples: [{ label: '[[1,2,3],[4,0,5]] → 1', args: { board: [[1, 2, 3], [4, 0, 5]] } },
             { label: '[[4,1,2],[5,0,3]] → 5', args: { board: [[4, 1, 2], [5, 0, 3]] } },
             { label: '[[1,2,3],[5,4,0]] → -1', args: { board: [[1, 2, 3], [5, 4, 0]] } }],
  view: [760, 280],
  run({ board }) {
    const F = [], goal = '123450', start = board.flat().join(''), dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
    const q = [[start, 0]], visited = new Set([start]), parent = { [start]: null }, layers = [1]; let found = null;
    const snap = (line, msg, ex = {}) => F.push({ line, msg, board: ex.board || start, layers: [...layers], ...ex, vars: { 已访问: visited.size + ' 个状态', 队列: q.length, ...(ex.v || {}) } });
    snap(5, `起点 "${start}"，目标 "${goal}"，0 表示空格。BFS 一层一层扩展。`, { layer: 0 });
    while (q.length) {
      const [p, step] = q.shift();
      if (p === goal) { found = step; break; }
      const pos = p.indexOf('0'), i = Math.floor(pos / 3), j = pos % 3;
      for (const [di, dj] of dirs) {
        const x = i + di, y = j + dj; if (x < 0 || x >= 2 || y < 0 || y >= 3) continue;
        const a = [...p]; [a[x * 3 + y], a[i * 3 + j]] = [a[i * 3 + j], a[x * 3 + y]]; const ps = a.join('');
        if (!visited.has(ps)) { visited.add(ps); parent[ps] = p; q.push([ps, step + 1]); layers[step + 1] = (layers[step + 1] || 0) + 1; }
      }
      if (!q.length || q[0][1] > step) snap(22, `第 ${step} 层扩展完，发现 ${layers[step + 1] || 0} 个新状态（第 ${step + 1} 层）。`, { board: p, layer: step + 1 });
    }
    if (found === null) { snap(25, `${visited.size} 个可达状态全部试过，都不是目标，返回 -1。`, { fail: true }); return F; }
    const path = []; for (let s = goal; s; s = parent[s]) path.unshift(s);
    snap(11, `在第 ${found} 层第一次遇到目标，返回 ${found}。下面回放这条最短路径。`, { found });
    for (let k = 1; k < path.length; k++) { const m = path[k - 1].indexOf('0');
      snap(11, `第 ${k} 步：把 ${path[k][m]} 滑进空格。`, { board: path[k], movedIdx: m, found, replay: k }); }
    return F;
  },
  render(f) {
    let s = ''; const cw = 70, X0 = 40, Y0 = 52;
    s += T(X0, 30, f.replay ? `回放第 ${f.replay} 步` : '当前状态', 'tl');
    for (let k = 0; k < 6; k++) {
      const ch = f.board[k], x = X0 + (k % 3) * (cw + 6), y = Y0 + Math.floor(k / 3) * (cw + 6);
      let cls = ch === '0' ? 'ghost' : 'cell';
      if (f.board === '123450' && ch !== '0') cls = 'ok';
      if (f.movedIdx === k) cls = 'cur';
      s += R(x, y, cw, cw, cls, 10) + (ch === '0' ? '' : T(x + cw / 2, y + cw / 2 + 8, ch, 'big', MID));
    }
    const L = f.layers, max = Math.max(...L.map(v => v || 0)), bx = 330, by = 236, bw = Math.min(22, (740 - bx) / L.length - 3);
    s += T(bx, 30, 'BFS 每一层的新状态数', 'tl');
    L.forEach((v, d) => { const hgt = (v || 0) / max * 170, x = bx + d * (bw + 3);

{ id: '787', title: 'Cheapest Flights Within K Stops', short: 'Cheapest Flights K Stops', diff: 'M', freq: 71.3, solved: true, slug: 'cheapest-flights-within-k-stops',
  idea: '<b>思路：</b>Dijkstra 的变体：堆里存 (价格, 城市, 剩余可飞段数)，每次弹出最便宜的。第一次弹出终点时的价格就是答案，因为堆保证弹出顺序按价格递增。剩余段数为 0 的状态不再扩展。这个写法没有对 (城市, 段数) 去重，图大时可能重复入堆很多次，面试时可以提一下用 best[city][steps] 剪枝。',
  code: `class Solution(object):
    def findCheapestPrice(self, n, flights, src, dst, K):
        f = collections.defaultdict(dict)
        for u, v, w in flights:
            f[u][v] = w
        # q saves the price to current city, current city, and the remaing steps
        q = [(0, src, K+1)]
        while q:
            price, curr, step = heapq.heappop(q)
            if curr == dst:
                return price
            if step > 0:
                for next in f[curr]:
                    heapq.heappush(q, (price + f[curr][next], next, step-1))
        return -1`,

{ id: '1500', title: 'Design a File Sharing System', short: 'File Sharing System', diff: 'M', freq: null, solved: true, slug: 'design-a-file-sharing-system',
  idea: '<b>思路：</b>两张互为索引的表：users[用户] = 他有的块，files[块] = 有这个块的用户。离开的用户 ID 放进最小堆 lefts，新用户优先复用最小的 ID，否则用 用户数 + 1（离开的用户仍算在 users 里，所以 ID 不会撞）。request 返回拥有该块的用户（排序后），非空就让请求者也拥有它。',
  code: `class FileSharing(object):
    def __init__(self, m):
        self.users = defaultdict(set) # e.g. user1: { file1, file2... }
        self.files = defaultdict(set) # e.g. file1: { user1, user2... }
        self.lefts = [] # minheap

    def join(self, ownedChunks):
        userId = len(self.users) + 1
        if len(self.lefts) > 0:
            userId = heappop(self.lefts)
        self.users[userId] = set(ownedChunks)
        for c in ownedChunks:
            self.files[c].add(userId)
        return userId

    def leave(self, userID):
        if userID not in self.users:
            return
        for c in self.users[userID]:
            self.files[c].remove(userID)
        self.users[userID] = set()
        heappush(self.lefts, userID)

    def request(self, userID, chunkID):
        arr = list(self.files[chunkID])
        arr.sort()
        if len(arr) > 0:
            self.users[userID].add(chunkID)
            self.files[chunkID].add(userID)
        return arr`,
  examples: [{ label: 'LeetCode 示例', args: { m: 4, ops: [['join', [1, 2]], ['join', [2, 3]], ['join', [4]], ['request', 1, 3], ['request', 2, 2], ['leave', 1], ['request', 2, 1], ['leave', 2], ['join', []]] } },
             { label: 'ID 复用', args: { m: 3, ops: [['join', [1]], ['join', [2]], ['leave', 1], ['join', [3]], ['request', 2, 3]] } }],
  view: [760, 300],
  run({ m, ops }) {
    const F = [], users = {}, files = {}, lefts = [], log = []; let opLabel = `FileSharing(${m})`;
    const fs = c => files[c] || (files[c] = new Set()), sorted = a => [...a].sort((x, y) => x - y);
    const snap = (line, msg, ex = {}) => F.push({ line, msg, m, users: Object.fromEntries(Object.entries(users).map(([u, st]) => [u, [...st]])), lefts: sorted(lefts), log: [...log], ...ex,
      vars: { 操作: opLabel, lefts: `[${sorted(lefts)}]`, ...(ex.v || {}) } });
    snap(5, `${m} 个文件块，还没有用户。`);
    for (const op of ops) {
      if (op[0] === 'join') {
        const own = op[1]; opLabel = `join([${own}])`;
        let id = Object.keys(users).length + 1, reuse = false;
        if (lefts.length) { lefts.sort((a, b) => a - b); id = lefts.shift(); reuse = true; }
        snap(reuse ? 10 : 8, reuse ? `lefts 不为空，复用最小的离开 ID ${id}。` : `新 ID = 用户数 + 1 = ${id}。`, { row: id });
        users[id] = new Set(own); own.forEach(c => fs(c).add(id)); log.push([opLabel, String(id)]);
        snap(14, `用户 ${id} 拥有块 [${own}]，返回 ${id}。`, { row: id });
      } else if (op[0] === 'leave') {
        const id = op[1]; opLabel = `leave(${id})`;
        if (!(id in users)) { log.push([opLabel, 'None']); snap(18, `用户 ${id} 不存在，直接返回。`); continue; }
        users[id].forEach(c => files[c].delete(id)); users[id] = new Set(); lefts.push(id); log.push([opLabel, 'None']);
        snap(22, `用户 ${id} 离开：从每个块的拥有者里删掉它，ID 放进 lefts。`, { row: id });
      } else {
        const [, id, c] = op, arr = sorted(fs(c)); opLabel = `request(${id}, ${c})`;
        snap(26, `块 ${c} 现在在用户 [${arr}] 手里（排序后）。`, { row: id, col: c, owners: arr });
        if (arr.length) { users[id].add(c); fs(c).add(id); snap(29, `非空，用户 ${id} 也拿到块 ${c}。`, { row: id, col: c, owners: arr, got: true }); }
        log.push([opLabel, `[${arr}]`]); snap(30, `返回 [${arr}]。`, { row: id, col: c, owners: arr, got: arr.length > 0 });
      }
    }
    return F;
  },
  render(f) {
    let s = ''; const X0 = 150, Y0 = 46, cw = 50, ch = 36, ids = Object.keys(f.users).map(Number).sort((a, b) => a - b);
    for (let c = 1; c <= f.m; c++) s += T(X0 + (c - 1) * cw + (cw - 6) / 2, Y0 - 10, `块 ${c}`, f.col === c ? 'tb' : 'tm', MID);
    if (!ids.length) s += T(X0, Y0 + 20, '还没有用户', 'tm');
    ids.forEach((u, r) => {
      const y = Y0 + r * ch, left = f.lefts.includes(u);
      s += T(X0 - 12, y + 20, `用户 ${u}${left ? '（已离开）' : ''}`, u === f.row ? 'tb' : 'tm', END);
      for (let c = 1; c <= f.m; c++) {
        const has = f.users[u].includes(c); let cls = has ? 'ok' : left ? 'ghost' : 'cell';
        if (f.owners && f.owners.includes(u) && c === f.col) cls = 'acc';
        if (u === f.row && c === f.col) cls = f.got ? 'ok' : 'cur';
        s += R(X0 + (c - 1) * cw, y, cw - 6, ch - 8, cls, 5) + (has ? T(X0 + (c - 1) * cw + (cw - 6) / 2, y + 19, '✓', 'tb', MID) : '');
      }
      if (u === f.row) s += R(X0 - 4, y - 4, f.m * cw + 2, ch, 'mark', 7);
    });
    s += T(440, 30, '调用记录', 'tl');
    const lg = f.log.slice(-9);
    lg.forEach(([o, r], j) => { const last = j === lg.length - 1; s += T(440, 54 + j * 24, o, last ? 'tb' : '') + T(740, 54 + j * 24, r, last ? 'tb' : 'tm', END); });
    s += T(24, 286, `lefts（最小堆）: [${f.lefts}]`, 'tl');
    return s;
  } },
];

/* ---------- app ---------- */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = { p: null, ex: 0, frames: [], i: 0, timer: null };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

function hl(line) {
  const e = esc(line), h = e.indexOf('#');
  const kw = t => t.replace(/\b(def|class|return|for|in|if|while|not|and|or|continue|None|True|False|lambda)\b/g, '<span class="kw">$1</span>');
  return h < 0 ? kw(e) : kw(e.slice(0, h)) + `<span class="cm">${e.slice(h)}</span>`;
}

function buildList() {
  const both = PROBLEMS.filter(p => p.both), rest = PROBLEMS.filter(p => !p.both && !p.solved);
  const solved = PROBLEMS.filter(p => p.solved).sort((a, b) => (b.freq ?? -1) - (a.freq ?? -1));
  const item = p => `<button class="item" data-id="${p.id}"><span class="no">${p.id}</span><span class="nm">${esc(p.short || p.title)}${p.both ? ' <span class="star">★</span>' : ''}</span><span class="meta">${DIFF[p.diff]}${p.freq === null ? '' : ' · ' + p.freq + '%'}${p.solved ? ' · 已做' : ''}</span></button>`;
  $('#list').innerHTML = `<h2>两份清单都有</h2>${both.map(item).join('')}<h2>频率最高、还没做</h2>${rest.map(item).join('')}<h2>repo 里已做过（复习）</h2>${solved.map(item).join('')}`;
  $('#list').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) select(b.dataset.id, 0); });
}

function select(id, ex) {
  const p = PROBLEMS.find(x => x.id === id) || PROBLEMS[0];
  S.p = p; S.ex = ex; S.frames = p.run(p.examples[ex].args); S.i = 0;
  store.set('airbnb-viz-p', p.id);
  if (location.hash !== '#p' + p.id) history.replaceState(null, '', '#p' + p.id);
  document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', b.dataset.id === p.id));
  $('#head').innerHTML = `<h2>${p.id}. ${esc(p.title)}</h2><span class="chip ${p.diff}">${DIFF[p.diff]}</span>${p.freq === null ? '' : `<span class="chip">频率 ${p.freq}%</span>`}${p.solved ? '<span class="chip">已在 repo · airbnb/</span>' : ''}${p.both ? '<span class="chip both">★ 面经也有</span>' : ''}<a href="https://leetcode.com/problems/${p.slug}/" target="_blank" rel="noopener">在 LeetCode 打开 ↗</a>`;
  $('#idea').innerHTML = p.idea;
  $('#examples').innerHTML = '<span>示例</span>' + p.examples.map((e, i) => `<button class="ex" data-i="${i}" aria-pressed="${i === ex}">${esc(e.label)}</button>`).join('');
  $('#code').innerHTML = p.code.split('\n').map((l, i) => `<div class="ln" data-n="${i + 1}"><span class="n">${i + 1}</span><span>${hl(l) || ' '}</span></div>`).join('');
  $('#scrub').max = S.frames.length - 1;
  stop(); draw();
  if (!reduced) play();
}

function draw() {
  const f = S.frames[S.i], p = S.p;
  $('#stage').innerHTML = `<svg viewBox="0 0 ${p.view[0]} ${p.view[1]}" role="img" aria-label="${esc(p.title)} 第 ${S.i + 1} 步">${DEFS}${p.render(f)}</svg>`;
  $('#msg').innerHTML = `<span class="stepn">STEP ${S.i + 1}</span>${esc(f.msg)}`;
  $('#count').textContent = `${S.i + 1} / ${S.frames.length}`;
  $('#scrub').value = S.i;
  const pane = $('#code');
  pane.querySelectorAll('.ln.on').forEach(x => x.classList.remove('on'));
  const ln = pane.querySelector(`.ln[data-n="${f.line}"]`);
  if (ln) { ln.classList.add('on'); const t = ln.offsetTop - pane.clientHeight / 2 + ln.clientHeight; pane.scrollTop = Math.max(0, t); }
  $('#vars').innerHTML = Object.entries(f.vars || {}).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
}

function go(i) { S.i = Math.max(0, Math.min(S.frames.length - 1, i)); draw(); }
function play() {
  if (S.i >= S.frames.length - 1) S.i = 0;
  stop(); $('#play').textContent = '暂停'; $('#play').setAttribute('aria-label', '暂停');
  const tick = () => { if (S.i >= S.frames.length - 1) { stop(); return; } go(S.i + 1); S.timer = setTimeout(tick, 1100 / +$('#speed').value); };
  S.timer = setTimeout(tick, 1100 / +$('#speed').value);
}
function stop() { clearTimeout(S.timer); S.timer = null; $('#play').textContent = '播放'; $('#play').setAttribute('aria-label', '播放'); }

$('#play').onclick = () => S.timer ? stop() : play();
$('#next').onclick = () => { stop(); go(S.i + 1); };
$('#prev').onclick = () => { stop(); go(S.i - 1); };
$('#reset').onclick = () => { stop(); go(0); };
$('#scrub').oninput = e => { stop(); go(+e.target.value); };
$('#examples').addEventListener('click', e => { const b = e.target.closest('.ex'); if (b) select(S.p.id, +b.dataset.i); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(S.i + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(S.i - 1); }
  else if (e.key === ' ' && !e.target.matches('button')) { e.preventDefault(); S.timer ? stop() : play(); }
});

buildList();
const fromHash = location.hash.replace('#p', '');
select(PROBLEMS.some(p => p.id === fromHash) ? fromHash : (store.get('airbnb-viz-p') || '751'), 0);
</script>
